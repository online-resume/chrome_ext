<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Resume Builder - Page Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="24" height="24">
    <h1>AI Resume Builder</h1>
    <span id="who" class="muted" hidden></span>
    <button id="sign-out" class="link" type="button" title="Sign out of the extension" hidden>Sign out</button>
    <button id="open-app" class="link" type="button" title="Open AI Resume Builder in a new tab">Open app</button>
  </header>

  <form id="sign-in" hidden>
    <p class="muted">Sign in with your AI Resume Builder username and password. What you send is saved under your own account.</p>
    <label>Username <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
    <p id="sign-in-status" class="note bad" role="status" hidden></p>
  </form>

  <p id="problem" class="note bad" hidden></p>

  <main id="page" hidden>
    <p class="page-title" id="page-title"></p>
    <p class="muted" id="found"></p>
    <p id="visa" class="visa" title="Read from the text below by fixed rules. Check the posting yourself when it matters."></p>

    <label>Job title <input id="job-title" type="text" maxlength="200" placeholder="e.g. Data Engineer"></label>
    <div class="row">
      <label>Company <input id="company" type="text" maxlength="200"></label>
      <label>Location <input id="location" type="text" maxlength="200"></label>
    </div>

    <label>Text to send
      <select id="part"></select>
    </label>
    <textarea id="text" rows="9" spellcheck="false" aria-label="The text that will be sent. You can edit it."></textarea>
    <p class="muted" id="size"></p>

    <button id="send" class="primary" type="button">Send to Resume Builder as a role</button>
    <button id="copy" class="wide" type="button">Copy text</button>
    <p id="status" class="note" role="status" hidden></p>
  </main>

  <details id="settings">
    <summary>Settings</summary>
    <label>Where AI Resume Builder runs
      <input id="base" type="url" placeholder="http://localhost:8000">
    </label>
    <button id="save-base" type="button">Save</button>
    <label class="tick"><input id="offer" type="checkbox"> On Indeed, LinkedIn, Dice, Glassdoor and ZipRecruiter, ask me whether to send the job I open</label>
    <p class="muted">Your password is sent to this address once, to sign in, and is not kept. You stay signed in for 7 days.</p>
  </details>

  <script src="sponsorship.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
